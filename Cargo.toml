[package]
name = "varaix"
version = "0.0.1"
edition = "2024"
description = "A minimal, deterministic, chart description language that renders to SVG."
authors = ["Sanjith Muralikrishnan <sanjith.develops@gmail.com>"]

[lib]
name = "varaix"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "varaix-cli"
path = "src/main.rs"

[[bin]]
name = "varaix-benchmark"
path = "src/bin/benchmark.rs"

[dependencies]
csv = "1"
wasm-bindgen = "0.2"
